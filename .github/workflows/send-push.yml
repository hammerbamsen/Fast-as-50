name: Send daglig push-påmindelse

# Sender én daglig notifikation pr. atlet med dagens pas (hviledage springes over).
# Aktiveres når VAPID_PRIVATE + PRIVATE_REPO(+TOKEN) secrets er sat.
on:
  schedule:
    - cron: '0 5 * * *'    # 05:00 UTC = 06:00/07:00 CET — morgenpåmindelse
    - cron: '0 17 * * *'   # 17:00 UTC = 18:00/19:00 CET — aften AF-check-in
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily eller evening (kun ved manuel kørsel)'
        default: daily
        type: choice
        options:
          - daily
          - evening

permissions:
  contents: read

concurrency:
  group: send-push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.FAF_APP_ID != '' && secrets.FAF_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout (kun scripts)
        uses: actions/checkout@v4
      - name: Install deps
        run: pip install requests pywebpush
      - name: GitHub App-token til det private repo
        # Mintes pr. kørsel af den App Worker'en allerede bruger (4259031) og
        # udløber efter en time — ingen langlivet nøgle at forny. Kører kun når
        # FAF_APP_ID/FAF_APP_PRIVATE_KEY er sat; ellers falder vi tilbage til
        # PAT'en, så push aldrig stopper midt i en omlægning. docs/PAT_RENEWAL.md.
        id: apptoken
        if: env.HAS_APP == 'true'
        # Fejler mintningen (app ikke installeret på det private repo, forkert
        # nøgle), falder vi tilbage til PAT'en i stedet for at vælte jobbet —
        # push er vigtigere end hvilken nøgle der bruges.
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FAF_APP_ID }}
          private-key: ${{ secrets.FAF_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: fast-as-50-private
      - name: Send push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          PRIVATE_REPO_TOKEN: ${{ steps.apptoken.outputs.token || secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO_AUTH: ${{ steps.apptoken.outputs.token && 'app' || 'pat' }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_MODE: ${{ github.event.schedule == '0 17 * * *' && 'evening' || (github.event.inputs.mode || 'daily') }}
        run: python scripts/send_push.py
