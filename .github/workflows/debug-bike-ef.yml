name: Debug — cykel-EF audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Kør audit
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
        run: python scripts/debug_bike_ef.py
      - name: Commit resultat
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add debug/bike_ef_audit.txt
          git commit -m "Debug: cykel-EF audit" || echo "ingen ændring"
          git push
