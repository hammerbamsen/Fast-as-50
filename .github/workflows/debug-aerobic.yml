name: Debug aerobe felter (midlertidig)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Kør diagnose
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: i599466
        run: python3 scripts/debug_aerobic_fields.py > debug_aerobic_output.txt 2>&1 || true
      - name: Commit output
        run: |
          git config user.name "debug-bot"
          git config user.email "debug@local"
          git add -f debug_aerobic_output.txt
          git commit -m "Debug output: aerobe felter" || echo "ingen ændring"
          git push
