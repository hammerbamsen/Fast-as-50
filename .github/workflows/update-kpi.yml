name: Daglig dashboard-opdatering

on:
  # CRON GENAKTIVERET 2026-07-04: Actions er primær opdater-kilde (kører uden Mac).
  # Tidligere antagelse om at Intervals blokerer Actions-IPs var forkert (bevist 2/7 + 4/7).
  # launchd på Mac beholdes som redundans — concurrency-lås håndterer overlap.
  # 2026-07-08: */10 blev throttlet hårdt af GitHub (timers-huller) — ændret til */30
  # for færre oversprungne kørsler. Data ændrer sig sjældnere end det alligevel.
  schedule:
    - cron: '*/30 * * * *'
    # 2026-09-07 (blok 7): 7/9 lå der 4,5 timer uden kørsel mellem 00:44 og
    # 05:10 UTC selv om */30 stod på — GitHub springer hyppige crons over.
    # De to faste linjer er SEPARATE schedules og rammer morgenen, hvor Garmin
    # har synket HRV/søvn (06:30 og 07:15 CEST). health.json's
    # expectedEveryMin for dette workflow er 60.
    - cron: '30 4 * * *'   # 04:30 UTC = 06:30 CEST
    - cron: '15 5 * * *'   # 05:15 UTC = 07:15 CEST
  workflow_dispatch:
    inputs:
      force_coach:
        description: 'Tving frisk AI-coachvurdering (ignorer 6-timers cache)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kpi-update
  cancel-in-progress: false

jobs:
  opdater:
    runs-on: ubuntu-latest
    # En hængende Intervals-/Anthropic-forbindelse må ikke blokere
    # concurrency-gruppen i timevis (default er 360 min).
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: pip install requests
      - name: Kør opdatering
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Sat via workflow_dispatch-input. Cron-korsler sender ingen inputs
          # -> tom streng -> cachen respekteres som hidtil.
          COACH_FORCE: ${{ inputs.force_coach && '1' || '' }}
        run: python scripts/update_kpi.py
      # data.json skrives af scriptet via GitHub Contents API (modules/github.gh_put)
      # — intet lokalt commit/push-step nødvendigt (fjernet 3/9-2026, var dødt).
