name: Byg workouts i Intervals.icu

on:
  schedule:
    - cron: '0 5 * * 0'  # Hver søndag kl. 05:00 UTC
  workflow_dispatch:
    inputs:
      week_only:
        description: 'Upload kun specifik uge (0=fremtidige uger, -1=alle)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  build-workouts:
    runs-on: ubuntu-latest
    outputs:
      week: ${{ steps.nextweek.outputs.week }}
      program: ${{ steps.nextweek.outputs.program }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Upload workouts til Intervals.icu
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          WEEK_ONLY: ${{ github.event.inputs.week_only || '0' }}
        run: python3 scripts/build_workouts.py $WEEK_ONLY

      - name: Beregn næste uge (program + ugenummer via modules/programs.py)
        id: nextweek
        if: success()
        run: |
          # Programmet der er aktivt om 7 dage — så et programskifte (fx medoc-2026
          # -> tds-2027) giver uge 1 i det nye program, ikke sidste uge i det gamle.
          OUT=$(python3 -c "
          import json, sys
          from datetime import date, timedelta
          sys.path.insert(0, 'scripts')
          from modules import programs
          plan = json.load(open('data/plan.json', encoding='utf-8'))
          nxt = date.today() + timedelta(days=7)
          prog = programs.active_program(plan, 'kennet', nxt)
          print(prog['id'], programs.week_no(prog, nxt))
          ")
          PROGRAM=$(echo "$OUT" | awk '{print $1}')
          WEEK=$(echo "$OUT" | awk '{print $2}')
          echo "Næste uge = $PROGRAM uge $WEEK"
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "program=$PROGRAM" >> "$GITHUB_OUTPUT"

      - name: Notifikation ved fejl
        if: failure()
        run: |
          curl -s -X POST "https://hook.eu1.make.com/rwyuzi27urezk1389gytkv8sda23jbdj" \
            -H "Content-Type: application/json" \
            -d '{"workflow":"${{ github.workflow }}","status":"FEJL","repo":"${{ github.repository }}","run":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

  # Native workflow_call — ingen PAT nødvendig (erstatter tidligere curl-dispatch med GH_TOKEN)
  outlook-sync:
    needs: build-workouts
    uses: ./.github/workflows/create-outlook-events.yml
    with:
      week: ${{ needs.build-workouts.outputs.week }}
      program: ${{ needs.build-workouts.outputs.program }}
    secrets: inherit
