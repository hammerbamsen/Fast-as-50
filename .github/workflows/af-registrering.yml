name: Check-in registrering

on:
  repository_dispatch:
    types: [af-registrering, checkin]

permissions:
  contents: write

jobs:
  send-to-intervals:
    runs-on: ubuntu-latest
    # 2026-07-30: FLYTTET UD AF kpi-update-gruppen.
    # GitHub tillader kun ÉN ventende kørsel pr. concurrency-gruppe — også med
    # cancel-in-progress: false. Når webhook-receiver.yml fik en byrge af
    # aktivitets-events (29/7 kl. 05:22-05:24), stod AF-registreringen i kø og
    # blev cancelled efter 9 sekunder uden at køre et enkelt step. Worker'en
    # havde allerede svaret 200, så log-arket (dengang af.html) viste grønt "gemt" mens dagen
    # aldrig nåede Intervals. Egen gruppe = brugerskabte, ikke-idempotente
    # skrivninger konkurrerer aldrig med byrge-trafik. data.json-race mod en
    # samtidig update-kpi-kørsel er dækket af push-steppets fetch/rebase-loop.
    concurrency:
      group: af-registrering
      cancel-in-progress: false
    steps:
      - name: Send til Intervals.icu
        run: |
          DATE="${{ github.event.client_payload.date }}"
          ALKOHOL="${{ github.event.client_payload.alkohol }}"
          PROTEIN="${{ github.event.client_payload.protein }}"
          ENERGI="${{ github.event.client_payload.energi }}"
          STRESS="${{ github.event.client_payload.stress }}"
          SULT="${{ github.event.client_payload.sult }}"

          # Byg JSON payload. Alle felter er valgfrie (log-arket i index.html
          # gemmer ved hvert tryk, så alkohol kan mangle). Alkohol: 0 = AF-dag,
          # 1 = drak (valgt), 2 = drak (bare skete) — af.py regner alt != 0 som drikkedag.
          FIELDS=""
          if [ -n "$ALKOHOL" ]; then FIELDS="$FIELDS, \"Alkohol\": $ALKOHOL"; fi
          if [ -n "$PROTEIN" ]; then FIELDS="$FIELDS, \"protein\": $PROTEIN"; fi
          if [ -n "$ENERGI" ]; then FIELDS="$FIELDS, \"motivation\": $ENERGI"; fi
          if [ -n "$STRESS" ]; then FIELDS="$FIELDS, \"fatigue\": $STRESS"; fi
          # Aftensult: custom wellness-felt i Intervals (0 nej / 1 lidt / 2 ja)
          if [ -n "$SULT" ]; then FIELDS="$FIELDS, \"Aftensult\": $SULT"; fi
          if [ -z "$FIELDS" ]; then echo "::error::Tom payload for $DATE"; exit 1; fi
          PAYLOAD="{${FIELDS#, }}"

          HTTP=$(curl -s -o /tmp/resp.txt -w "%{http_code}" --max-time 30 --retry 3 --retry-all-errors --retry-delay 3 -X PUT \
            "https://intervals.icu/api/v1/athlete/i599466/wellness/$DATE" \
            -u "API_KEY:${{ secrets.INTERVALS_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "000")
          echo "Intervals svar ($HTTP):"
          cat /tmp/resp.txt 2>/dev/null || true
          # 7/9-2026 (blok 7): debug/af_dispatch_debug.txt skrives ikke længere —
          # udfaldet står i run-loggen, og health.yml registrerer fejl i health.json.

          if [ "$HTTP" != "200" ]; then
            echo "::error::Intervals PUT fejlede med HTTP $HTTP for $DATE"
            exit 1
          fi
          echo "Gemt: $DATE alkohol=$ALKOHOL"

      # Kun af-registrering opdaterer data.json's af_log/streak med det samme —
      # dette erstatter den GET+PUT-blok den gamle af.html lavede direkte i
      # browseren med sin PAT (fjernet i samme omgang som token-fri dispatch).
      # Check-in-arket (før: checkin.html, slettet blok 9) rørte aldrig data.json
      # client-side — af_log for checkin-events opdateres fortsat kun af den almindelige 30-min-cron.
      - name: Checkout
        if: github.event.action == 'af-registrering'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python setup
        if: github.event.action == 'af-registrering'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        if: github.event.action == 'af-registrering'
        run: pip install requests
      - name: Opdater data.json (af_log/streak)
        if: github.event.action == 'af-registrering'
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_kpi.py
      - name: Commit og push data.json
        if: github.event.action == 'af-registrering'
        run: |
          git config user.name "Fast as Fifty Bot"
          git config user.email "bot@hammerbamsen.github.io"
          git add data.json
          if git diff --staged --quiet; then
            echo "Ingen ændringer"
            exit 0
          fi
          git commit -m "AF-registrering: data.json opdateret $(date +%Y-%m-%d_%H:%M)"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin main && echo "Push OK forsøg $i" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          echo "Push fejlede efter 3 forsøg"
          exit 1
