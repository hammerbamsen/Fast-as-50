name: CI — pytest

# Kører modultests ved ændringer i kode OG i plan-data. Path-filteret sikrer
# at den hyppige data.json-push (KPI-bot hvert 10. min) IKKE trigger CI —
# men plan.json er en kontrakt testene håndhæver (programmer, uger, zoner),
# så den skal med.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/plan.json'
      - 'data/bike_library.json'
      - '.github/workflows/ci-pytest.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'data/plan.json'
      - 'data/bike_library.json'
      - '.github/workflows/ci-pytest.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: pip install pytest requests pywebpush
      - name: Run pytest
        run: python3 -m pytest scripts/modules/ -q
